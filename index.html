const LGN={ru:'Русский',en:'English',ky:'Кыргызча',kk:'Қазақша',tr:'Türkçe',zh:'中文'};
const t=k=>(LG[S.set.lg]||LG.en)[k]||LG.en[k]||k;
function applyLang(){LV.forEach((l,i)=>{l.n=t('n'+(i+1));l.ds=t('d'+(i+1));l.df='★'.repeat(i+1)});document.documentElement.lang=S.set.lg;document.title=t('ttl')+': '+t('sub')}
function initLang(){if(!LG[S.set.lg]){const l=((typeof navigator!='undefined'&&navigator.language)||'en').slice(0,2);S.set.lg=LG[l]?l:'en'}applyLang()}
let scr=null;const langSel=()=>`<select onchange="setLang(this.value)">${Object.keys(LGN).map(k=>`<option value=${k} ${S.set.lg==k?'selected':''}>${LGN[k]}</option>`).join('')}</select>`;
function setLang(v){S.set.lg=v;save();applyLang();if(scr)scr()}
// ===== UI =====
function ui(h){const u=$('ui');u.innerHTML=h;u.style.display=h?'flex':'none'}
function main(){state='menu';RT++;scr=main;$('tc').style.display='none';$('hint').textContent='';$('hud').style.display='none';big('');showMenuBike();ui(`<div class=orn></div><div class=t style="font-size:clamp(26px,6vw,56px);text-align:center">${t('ttl')}</div><div class=st>${t('sub')} 🇰🇬</div><div class=orn></div><div class=c>🪙 ${S.coins}</div>
<button class="b pri" onclick="play()">${t('play')}</button><button class=b onclick="levels()">${t('levels')}</button><button class=b onclick="bikes()">${t('bikes')}</button><button class=b onclick="char()">${t('char')}</button><button class=b onclick="sett('main')">${t('settings')}</button><button class=b onclick="try{document.documentElement.requestFullscreen()}catch(e){}">${t('full')}</button><button class=b onclick="about()">${t('about')}</button><button class=b onclick="ex()">${t('exit')}</button><div>🌐 ${langSel()}</div><div class=c>Сделано Жакыповым Сабитом</div>`)}
function play(){initAudio();startRace(S.un-1)}
function levels(){initAudio();scr=levels;ui(`<div class=t2>${t('levels')}</div><div class=row>${LV.map((l,i)=>{const o=i<S.un;return`<div class="card ${o?'':'lock'}"><div class=c>${i+1}. ${l.n}</div><div>${o?'🏔️':'🔒'} ${l.df} · AI ×${l.ai}</div><div>${l.ds}</div><div>${t('best')}: ${fmt(S.best[i])}</div><button class="b ${i==S.un-1?'pri':''}" style="min-width:0" ${o?'':'disabled'} onclick="startRace(${i})">${o?t('start'):'🔒'}</button></div>`}).join('')}</div><button class=b onclick="main()">${t('back')}</button>`)}
let bi=0;function bikes(){state='menu';bi=S.sel;bikeUI()}
function bikeUI(){scr=bikeUI;const b=BK[bi],bar=(n,v)=>`<label>${n}<div class=bar style="width:140px"><i style="width:${v*100}%"></i></div></label>`,o=S.own[bi];
ui(`<div class=t2>${t('bikes')}</div><div class=p style="margin-top:150px"><div class=c>${b.n} ${S.sel==bi?'✔':''} <small>(${bi+1}/${BK.length})</small></div>${bar(t('spd'),(b.sp-40)/35)}${bar(t('acc'),b.ac/1.4)}${bar(t('hnd'),b.hd)}${bar(t('brk'),b.br/1.4)}<div class=row><button class=b style="min-width:80px" onclick="bn(-1)">◀</button><button class="b pri" style="min-width:150px" onclick="bsel()">${o?(S.sel==bi?'✔':t('sel')):t('buy')+' 🪙'+b.cost}</button><button class=b style="min-width:80px" onclick="bn(1)">▶</button></div></div><div class=c>🪙 ${S.coins}</div><button class=b onclick="main()">${t('back')}</button>`);
clearR();const keep=S.sel;S.sel=bi;PL=mkR(true,0);S.sel=keep;PL.s=16;RC=[PL];place(PL,0)}
const JC=[0xd23a2a,0x2a6ad2,0x2aa04a,0xf2c230,0x8a2ad2,0xee7722,0x222222,0xeeeeee],PC=[0x2a3b5a,0x222222,0x4a3a2a,0x3a5a3a,0x5a2a2a],HC=[0xffffff,0xd23a2a,0x2a6ad2,0xf2c230,0x222222,0x2aa04a,0xee7722,0x8a2ad2],SKC=[0xf1c9a0,0xe0ac84,0xc68c5c,0x8d5a3a,0x5a3825],AR={j:JC,p:PC,h:HC,sk:SKC},pk=(a,i)=>a[Math.abs(i|0)%a.length];
function chOf(){const c=S.ch;return{j:pk(JC,c.j),p:pk(PC,c.p),h:pk(HC,c.h),w:Math.abs(c.w|0)%4,sk:pk(SKC,c.sk)}}
function char(){state='menu';scr=char;const rows=[['jkt','j',8],['pnt','p',5],['hat','h',8],['wear','w',4],['skin','sk',5]];
ui(`<div class=t2>${t('char')}</div><div class=p style="margin-top:150px">${rows.map(r=>`<label>${t(r[0])}<span><button class=b style="min-width:44px;padding:4px 10px" onclick="chg('${r[1]}',-1,${r[2]})">◀</button> ${r[1]=='w'?t('w'+S.ch.w):`<i style="display:inline-block;width:24px;height:24px;background:#${pk(AR[r[1]],S.ch[r[1]]).toString(16).padStart(6,'0')};border:2px solid #fff;vertical-align:middle"></i>`} <button class=b style="min-width:44px;padding:4px 10px" onclick="chg('${r[1]}',1,${r[2]})">▶</button></span></label>`).join('')}</div><button class="b pri" onclick="main()">${t('back')}</button>`);
clearR();PL=mkR(true,0);PL.s=16;RC=[PL];place(PL,0)}
function chg(k,d,n){S.ch[k]=((S.ch[k]|0)+d+n)%n;save();char()}
function bn(d){bi=(bi+d+BK.length)%BK.length;bikeUI()}
function bsel(){if(!S.own[bi]){if(S.coins<BK[bi].cost){beep(120,.3);return}S.coins-=BK[bi].cost;S.own[bi]=1;fanfare()}S.sel=bi;save();bikeUI()}
function sett(back){scr=()=>sett(back);const o=(a,v)=>a.map((x,i)=>`<option value=${i} ${v==i?'selected':''}>${x}</option>`).join(''),sl=(k,a,b)=>`<input type=range min=${a} max=${b} step=.05 value=${S.set[k]} oninput="setS('${k}',+this.value)">`;
ui(`<div class=t2>${t('settings')}</div><div class=p><label>${t('lang')}${langSel()}</label><label>${t('s_ai')}<select onchange="setS('df',+this.value)">${o(['Easy','Normal','Hard'],S.set.df)}</select></label><label>${t('s_gfx')}<select onchange="setS('gx',+this.value)">${o(['Low','Medium','High'],S.set.gx)}</select></label><label>${t('s_fx')}<select onchange="setS('fx',+this.value)">${o(['Off','On'],S.set.fx)}</select></label>
<label>${t('s_vol')}${sl('vol',0,1)}</label><label>${t('s_sen')}${sl('sen',.6,1.6)}</label><label>${t('s_cam')}${sl('cam',.7,1.6)}</label><button class=b onclick="if(confirm(t('conf'))){localStorage.removeItem('kpr');load();initLang();resize();main()}">${t('reset')}</button></div><button class="b pri" onclick="${back=='pause'?'pauseUI()':'main()'}">${t('back')}</button>`)}
function setS(k,v){S.set[k]=v;save();if(k=='gx')resize();if(k=='vol'&&mg)mg.gain.value=v}
function about(){scr=about;ui(`<div class=t2>${t('about')}</div><div class=p>${t('about_t')}<br><br>Сделано Жакыповым Сабитом 🇰🇬</div><button class="b pri" onclick="main()">${t('back')}</button>`)}
function ex(){scr=ex;ui(`<div class=t2>${t('exit')}</div><div class=p>${t('exit_t')}</div><button class="b pri" onclick="main()">${t('back')}</button>`)}
function pause(){pst=state;state='pause';pauseUI()}
function pauseUI(){scr=pauseUI;ui(`<div class=t2>${t('pause')}</div><button class="b pri" onclick="resume()">${t('resume')}</button><button class=b onclick="startRace(LI)">${t('restart')}</button><button class=b onclick="sett('pause')">${t('settings')}</button><button class=b onclick="main()">${t('menu')}</button>`)}
function resume(){ui('');state=pst}
function showResult(){scr=null;state='done';$('tc').style.display='none';$('hud').style.display='none';const pos=PL.fin,win=pos==1,tb=Math.max(0,Math.round(lvl.L/40-PL.ft))*2,co=[120,70,40,20,10,5][pos-1]+(LI+1)*20+tb+PL.coins*5;
S.coins+=co;S.st.races++;if(!S.best[LI]||PL.ft<S.best[LI])S.best[LI]=PL.ft;let nl='';if(win){S.st.wins++;if(LI<2&&S.un<LI+2){S.un=LI+2;nl=`<div class=c>🔓 ${t('unl')}</div>`}}save();
if(win&&LI==2){champ();return}
fanfare();ui(`<div class=t>${win?t('win'):t('fin')}</div><div class=p><div class=c>${t('pos')}: ${pos}/${RC.length}</div><div>${t('time')}: ${fmt(PL.ft)}</div><div>${t('best')}: ${fmt(S.best[LI])}</div><div>${t('prize')}: 🪙 ${co} (${t('coinsOn')}: ${PL.coins})</div>${nl}</div>${win&&LI<2?`<button class="b pri" onclick="startRace(${LI+1})">${t('next')}</button>`:''}<button class="b ${win&&LI<2?'':'pri'}" onclick="startRace(LI)">${t('replay')}</button><button class=b onclick="main()">${t('menu')}</button>`)}
function champ(){fanfare();setTimeout(fanfare,900);ui(`<div class=t>${t('champ')}</div><div class=p><div class=c>${t('time')}: ${fmt(PL.ft)}</div><div>${t('mon')}: 🪙 ${S.coins}</div></div><button class="b pri" onclick="main()">${t('menu')}</button><button class=b onclick="startRace(2)">${t('replay')}</button>`);
for(let i=0;i<40;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','⭐','🏔️','🏍️'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDuration=3+Math.random()*3+'s';s.style.animationDelay=Math.random()*2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),9000)}}
// ===== Input / loop =====
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();K[e.code]=1;initAudio();
if(e.code=='Escape'){if(state=='race'||state=='count')pause();else if(state=='pause')resume()}
if(e.code=='KeyR'&&state=='race'&&!PL.fin){PL.d=0;PL.v*=.3}
if(e.code=='Enter'){const b=document.querySelector('#ui .pri');if(b&&state!='race'){e.preventDefault();b.click()}}});
addEventListener('keyup',e=>{K[e.code]=0});addEventListener('blur',()=>{for(const k in K)K[k]=0;if(state=='race'||state=='count')pause()});
const TOUCH=('ontouchstart' in window)||(typeof matchMedia=='function'&&matchMedia('(pointer:coarse)').matches);
if(TOUCH){document.body.classList.add('touch');document.querySelectorAll('#tc [data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;initAudio()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{K[k]=0}))});$('pz').onclick=()=>{if(state=='race'||state=='count')pause()}}
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
if(state=='race'||state=='fin'){autoQ(dt);stepRace(dt);if(state=='fin'){finT+=dt;if(finT>2.5)showResult()}}
if(state=='race'||state=='fin'||state=='count'){camFollow(dt,false);if(state=='race'||state=='fin')hud()}else if(state!='pause'&&PL)orbit(dt);
if(state!='pause'){if(water){water.position.y=lvl.wy+Math.sin(t*.002)*.12;water.material.color.setHSL(.57+Math.sin(t*.0007)*.01,.65,.42+Math.sin(t*.003)*.04)}clouds.forEach(c=>{c.position.x+=dt*3;if(c.position.x>500)c.position.x=-500;if(c.position.z>cam.position.z+400)c.position.z-=800;if(c.position.z<cam.position.z-400)c.position.z+=800});dustStep(dt);fxStep(dt);audioStep(dt)}
if(PL){const g=PL.g.position;sunL.target.position.copy(g);sunL.position.set(g.x+60,g.y+100,g.z+40)}
if(skyM)skyM.position.copy(cam.position);R.render(scene,cam)}
load();initLang();resize();loadLevel(0);main();requestAnimationFrame(loop);
